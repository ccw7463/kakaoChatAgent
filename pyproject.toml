[project]
name = "kakaochatbot"
version = "0.1.0"
description = "Langgraph 기반 카카오톡 채널 챗봇 에이전트"
readme = "README.md"
authors = [{ name = "ccw7463" }]
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0.1",
    "fastapi>=0.115.6",
    "uvicorn>=0.34.0",
    "langchain-core>=1.6.0",
    "langchain-openai>=1.6.0",
    "langgraph>=1.2.11",
    "ml-collections>=1.0.0",
    "tavily-python>=0.8.0",
    "httpx>=0.27.0",
    "psycopg[binary,pool]>=3.2.0",
]

[dependency-groups]
dev = [
    "black>=24.10.0",
    "ipykernel>=6.29.5",
]

# 라이브러리가 아닌 애플리케이션이므로 패키지로 빌드하지 않는다.
[tool.uv]
package = false
